services:
  tests:
    build:
      context: ../..
      dockerfile: tools/ci-linux/Dockerfile
    init: true
    shm_size: 1gb
    volumes:
      - contrast-reports:/workspace/node_modules/.cache/contrast-reports
      - checks-cache:/var/cache/tessera-checks

volumes:
  contrast-reports:
  checks-cache:
    name: tessera-ci-linux-checks-cache
